services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
